services:
  mariadb:
    image: mariadb:11
    container_name: mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpass123
      MARIADB_DATABASE: practica05juarez
      MARIADB_USER: flaskuser
      MARIADB_PASSWORD: flaskpass123
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/datos.sql:/docker-entrypoint-initdb.d/02-datos.sql:ro
    networks:
      - red_interna
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  flask:
    build: ./app
    container_name: flask
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_USER: flaskuser
      DB_PASSWORD: flaskpass123
      DB_NAME: practica05juarez
    depends_on:
      mariadb:
        condition: service_healthy
    expose:
      - "5000"
    networks:
      - red_interna

  nginx:
    image: nginx:stable
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/ssl:ro
    depends_on:
      - flask
    networks:
      - red_interna

networks:
  red_interna:
    driver: bridge

volumes:
  mariadb_data: